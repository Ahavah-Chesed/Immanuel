<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>분위기로 찾는 찬양</title>

  <!-- 1. 화면의 색상과 배치를 정하는 CSS입니다. -->
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; background: #f7f7f2; color: #203d32;
      font-family: system-ui, "Malgun Gothic", sans-serif; line-height: 1.6;
    }
    main { max-width: 900px; margin: 0 auto; padding: 48px 20px; }
    h1 { margin: 0 0 12px; font-size: clamp(26px, 5vw, 40px); }
    .intro { color: #53665d; margin-bottom: 28px; }
    .search-box {
      background: white; padding: 24px; border: 1px solid #dce4dd;
      border-radius: 20px;
    }
    label { display: block; margin-bottom: 8px; font-weight: 700; }
    form { display: flex; gap: 8px; }
    input, select {
      flex: 1; min-width: 0; padding: 12px; border: 1px solid #9dab9f;
      border-radius: 10px; font: inherit;
    }
    button, .listen { min-height: 44px; font: inherit; cursor: pointer; }
    .search-button, .listen {
      border: 0; border-radius: 10px; padding: 12px 20px;
      background: #285b43; color: white; font-weight: 700;
    }
    .hint, .note { color: #53665d; font-size: 14px; }
    .catalog-summary { color: #285b43; font-size: 14px; font-weight: 700; }
    .filters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
    select { width: 100%; background: white; color: #203d32; min-height: 48px; }
    .tag-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .tag-button {
      border: 1px solid #c9d7cd; border-radius: 24px;
      padding: 8px 16px; background: #f2f6f0; color: #285b43;
    }
    .tag-button.active { background: #285b43; color: white; border-color: #285b43; }
    .count { margin: 28px 0 12px; font-weight: 700; }
    .song-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .song-card {
      display: flex; flex-direction: column; align-items: flex-start;
      padding: 24px; background: white; border: 1px solid #dce4dd; border-radius: 16px;
    }
    .song-card h2 { margin: 0 0 4px; font-size: 20px; overflow-wrap: anywhere; }
    .artist { margin: 0; color: #53665d; }
    .song-type { margin: 0 0 10px; padding: 3px 10px; background: #edf3ec; border-radius: 8px; color: #285b43; font-size: 13px; font-weight: 700; }
    .song-tags { color: #285b43; font-size: 14px; }
    .listen { display: inline-flex; align-items: center; text-decoration: none; margin-top: auto; }
    .listen:hover, .search-button:hover { background: #1b4331; }
    .empty { padding: 24px; text-align: center; color: #53665d; }
    .note { margin-top: 28px; }
    .pagination { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; margin-top: 24px; }
    .page-button { border: 1px solid #9dab9f; border-radius: 10px; background: white; color: #285b43; padding: 8px 18px; }
    .page-button:disabled { opacity: 0.45; cursor: default; }
    :focus-visible { outline: 3px solid #a56c16; outline-offset: 3px; }
    @media (max-width: 600px) {
      main { padding-top: 28px; }
      .search-box, .song-card { padding: 20px; }
      .song-list { grid-template-columns: 1fr; }
      form { flex-direction: column; }
      .filters { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- 2. 사용자가 보는 화면을 구성하는 HTML입니다. -->
  <main>
    <header>
      <h1>분위기로 찾는 찬양</h1>
      <p class="intro">제목을 몰라도 괜찮아요. 원하는 찬양의 분위기를 찾아보세요.</p>
      <p id="catalog-summary" class="catalog-summary"></p>
    </header>

    <section class="search-box" aria-label="찬양 검색">
      <label for="keyword">분위기 · 찬양 제목 · 찬양팀 · 찬송가 번호</label>
      <form id="search-form" role="search">
        <input id="keyword" type="search" placeholder="예: 신나는, 꽃들도, 305장"
          aria-describedby="search-hint" autocomplete="off">
        <button class="search-button" type="submit">검색</button>
      </form>
      <p id="search-hint" class="hint">분위기 단어만 입력하면 태그로 찾아요. 여러 단어는 모두 일치해야 해요. 예: 슬픈 잔잔한</p>
      <div id="tag-buttons" class="tag-buttons" role="group" aria-label="분위기 태그"></div>
      <div class="filters">
        <div>
          <label for="category-filter">찬양 종류</label>
          <select id="category-filter">
            <option value="">전체 종류</option>
            <option value="CCM">CCM</option>
            <option value="찬송가">찬송가</option>
          </select>
        </div>
        <div>
          <label for="artist-filter">찬양팀 · 음원</label>
          <select id="artist-filter"><option value="">전체 찬양팀 · 음원</option></select>
        </div>
      </div>
    </section>

    <p id="result-count" class="count" role="status" aria-live="polite" aria-atomic="true"></p>
    <section id="song-list" class="song-list" aria-label="검색된 찬양 목록"></section>
    <p id="empty-message" class="empty" hidden>검색 결과가 없어요. 다른 단어를 입력하거나 ‘전체’를 눌러보세요.</p>
    <nav id="pagination" class="pagination" aria-label="검색 결과 페이지" hidden>
      <button id="prev-page" class="page-button" type="button">이전</button>
      <span id="page-info"></span>
      <button id="next-page" class="page-button" type="button">다음</button>
    </nav>
    <p class="note">새찬송가 1~645장을 수록했습니다. 같은 곡도 찬양팀이나 영상이 다르면 별도의 버전으로 표시합니다. 분위기를 아직 확인하지 못한 곡은 ‘미분류’로 표시하며 제목과 찬양팀으로 검색할 수 있습니다. 분위기 태그는 초기 분류이며, 편곡과 듣는 사람에 따라 다르게 느껴질 수 있습니다.</p>
    <noscript>검색 기능을 사용하려면 브라우저에서 JavaScript를 허용해 주세요.</noscript>
  </main>

        "publisher": "Beecompany 비컴퍼니",
        "tags": [
          "경건한"
        ],
        "category": "찬송가",
        "hymnNumber": 645,
        "url": "https://www.youtube.com/watch?v=2NXi4P3e_Sk",
        "youtubeId": "2NXi4P3e_Sk"
      }
    ];

    // 4. 아래부터는 검색과 화면 표시 기능입니다.
    function normalize(text) {
      return text.normalize("NFC").toLowerCase().replace(/[\s().·_-]/g, "");
    }

    const allTags = [...new Set(songs.flatMap(song => song.tags))];
    const normalizedTags = new Set(allTags.map(normalize));

    function findSongs(query, category = "", artist = "") {
      // 공백, 쉼표, #으로 검색어를 구분합니다.
      const words = query.split(/[\s,#]+/).filter(Boolean).map(normalize);
      const moodOnlyQuery = words.length > 0 && words.every(word => normalizedTags.has(word));
      const numberQuery = normalize(query).match(/^(?:(?:새)?찬송가)?(\d{1,3})장?$/);
      return songs.filter(song => {
        if (category && song.category !== category) return false;
        if (artist && song.artist !== artist) return false;
        if (numberQuery) return song.hymnNumber === Number(numberQuery[1]);
        // '슬픈' 태그 검색에 밝은 곡인 '슬픈 마음 있는 사람'이 섞이지 않게 합니다.
        if (moodOnlyQuery) return words.every(word => song.tags.some(tag => normalize(tag) === word));
        const numberWords = song.hymnNumber ? [
          "새찬송가", String(song.hymnNumber), `${song.hymnNumber}장`,
          `찬송가 ${song.hymnNumber}장`, `새찬송가 ${song.hymnNumber}장`,
          `${String(song.hymnNumber).padStart(3, "0")}장`
        ] : [];
        const fields = [song.title, song.artist, song.publisher || "", song.category, ...(song.aliases || []), ...song.tags, ...numberWords].map(normalize);
        return words.every(word => {
          // 장 번호는 부분 일치 대신 정확히 비교합니다. 1장 검색에 11장이 섞이지 않습니다.
          const chapter = word.match(/^(?:(?:새)?찬송가)?(\d{1,3})장$/);
          if (chapter) return song.hymnNumber === Number(chapter[1]);
          return fields.some(field => field.includes(word));
        });
      });
    }

    const keyword = document.getElementById("keyword");
    const songList = document.getElementById("song-list");
    const resultCount = document.getElementById("result-count");
    const emptyMessage = document.getElementById("empty-message");
    const tagButtons = document.getElementById("tag-buttons");
    const categoryFilter = document.getElementById("category-filter");
    const artistFilter = document.getElementById("artist-filter");
    const pagination = document.getElementById("pagination");
    const prevPage = document.getElementById("prev-page");
    const nextPage = document.getElementById("next-page");
    const pageInfo = document.getElementById("page-info");
    const PAGE_SIZE = 40;
    let currentPage = 1;

    const artists = [...new Set(songs.map(song => song.artist))].sort((a, b) => a.localeCompare(b, "ko"));
    artists.forEach(artist => {
      const option = document.createElement("option");
      option.value = artist;
      option.textContent = artist;
      artistFilter.append(option);
    });
    const hymnCount = songs.filter(song => song.category === "찬송가").length;
    const hymnChapterCount = new Set(songs.filter(song => song.category === "찬송가").map(song => song.hymnNumber)).size;
    document.getElementById("catalog-summary").textContent =
      `총 ${songs.length}개 버전 · CCM ${songs.length - hymnCount}개 · 새찬송가 ${hymnChapterCount}장 수록 (${hymnCount}개 버전)`;

    // songs에 새 태그를 추가하면 태그 버튼도 자동으로 생깁니다.
    ["", ...allTags].forEach(tag => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "tag-button";
      button.dataset.tag = tag;
      button.textContent = tag || "전체";
      button.addEventListener("click", () => {
        keyword.value = tag;
        if (!tag) {
          categoryFilter.value = "";
          artistFilter.value = "";
        }
        renderSongs();
      });
      tagButtons.append(button);
    });

    function renderSongs(resetPage = true) {
      if (resetPage) currentPage = 1;
      const results = findSongs(keyword.value, categoryFilter.value, artistFilter.value);
      const totalPages = Math.max(1, Math.ceil(results.length / PAGE_SIZE));
      currentPage = Math.max(1, Math.min(currentPage, totalPages));
      const start = (currentPage - 1) * PAGE_SIZE;
      const visibleSongs = results.slice(start, start + PAGE_SIZE);
      songList.replaceChildren();
      const shown = results.length ? ` · ${start + 1}–${start + visibleSongs.length}개 표시` : "";
      resultCount.textContent = `${results.length}개 버전 검색됨${shown}`;
      emptyMessage.hidden = results.length > 0;
      pagination.hidden = results.length <= PAGE_SIZE;
      pageInfo.textContent = `${currentPage} / ${totalPages} 페이지`;
      prevPage.disabled = currentPage === 1;
      nextPage.disabled = currentPage === totalPages;

      tagButtons.querySelectorAll("button").forEach(button => {
        const sameTag = normalize(keyword.value.replace(/#/g, "")) === normalize(button.dataset.tag);
        const active = sameTag && (button.dataset.tag !== "" || (!categoryFilter.value && !artistFilter.value));
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });

      visibleSongs.forEach(song => {
        const card = document.createElement("article");
        card.className = "song-card";

        const title = document.createElement("h2");
        title.textContent = song.title;

        const type = document.createElement("p");
        type.className = "song-type";
        type.textContent = song.category === "찬송가" ? `새찬송가 ${song.hymnNumber}장` : "CCM";

        const artist = document.createElement("p");
        artist.className = "artist";
        artist.textContent = song.publisher && normalize(song.publisher) !== normalize(song.artist)
          ? `${song.artist} · 채널: ${song.publisher}` : song.artist;

        const tags = document.createElement("p");
        tags.className = "song-tags";
        tags.textContent = song.tags.length === 1 && song.tags[0] === "미분류"
          ? "분위기 미분류 · 제목과 찬양팀으로 찾아보세요."
          : song.tags.map(tag => `#${tag}`).join(" ");

        const link = document.createElement("a");
        link.className = "listen";
        link.href = song.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "유튜브에서 듣기 ↗";
        link.setAttribute("aria-label", `${type.textContent}, ${song.title}, ${song.artist} 버전 유튜브에서 듣기, 새 창`);

        card.append(type, title, artist, tags, link);
        songList.append(card);
      });
    }

    document.getElementById("search-form").addEventListener("submit", event => {
      event.preventDefault();
      renderSongs();
    });
    keyword.addEventListener("input", renderSongs);
    categoryFilter.addEventListener("change", renderSongs);
    artistFilter.addEventListener("change", renderSongs);
    prevPage.addEventListener("click", () => {
      currentPage -= 1;
      renderSongs(false);
      resultCount.scrollIntoView({ block: "start" });
    });
    nextPage.addEventListener("click", () => {
      currentPage += 1;
      renderSongs(false);
      resultCount.scrollIntoView({ block: "start" });
    });
    renderSongs();
  </script>
</body>
</html>
